name: Deploy Merchant Empire to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
  schedule:
    - cron: '* * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Sync Airtable data
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: apphq31BIymobdedD
          AIRTABLE_WAREHOUSE_TABLE_ID: tblnCpscQ0bX1bceO
          AIRTABLE_LEDGER_TABLE_ID: tblVnIvSbmb9aLHa7
          AIRTABLE_ORDERS_TABLE_ID: tbl5mzgHeJGbsDxdZ
        run: node scripts/sync-airtable.mjs

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
