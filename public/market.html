<!doctype html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#32100e"><title>Mercato Europe — Merchant Empire</title><style>@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Crimson+Pro:wght@400;500;600;700&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0d0806 url('/MerchantEmpire/art/wood-grain.svg') repeat;color:#ead8ae;font-family:'Crimson Pro',serif}.wrap{width:min(1100px,calc(100% - 24px));margin:auto;padding:22px 0 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #745027;padding-bottom:14px}.top a{color:#d5a642;text-decoration:none}.top small{display:block;letter-spacing:3px;color:#c69a42}.top h1{font:600 clamp(26px,5vw,42px) Cinzel;margin:5px 0}.panel{margin-top:16px;background:#2d160fee;border:2px ridge #876132;padding:16px;box-shadow:0 12px 28px #0009}.controls{display:grid;grid-template-columns:2fr 1fr .7fr .7fr auto;gap:9px;align-items:end}label{display:grid;gap:5px;color:#bda783}input,select,button{min-height:44px;border:1px solid #795328;background:#160d09;color:#ead8ae;padding:9px 11px;font:16px 'Crimson Pro'}button{background:#5a2118;color:#efd18a;font:600 12px Cinzel;cursor:pointer}.preset{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.preset button{min-height:36px}.status{margin:13px 0 0;color:#cbb08a}.results{display:grid;gap:10px;margin-top:14px}.card{display:grid;grid-template-columns:74px minmax(180px,1.4fr) repeat(4,minmax(110px,.7fr));gap:10px;align-items:center;background:#d4ba86 url('/MerchantEmpire/art/parchment-texture.svg');color:#2b1b10;border:2px ridge #986b30;padding:10px}.card img{width:68px;height:68px;object-fit:contain}.name b{font:600 15px Cinzel;display:block}.name small{overflow-wrap:anywhere}.metric small{display:block;color:#705637}.metric strong{font:600 18px Cinzel}.fresh{font-size:12px}.total{margin-top:12px;padding:14px;background:#25130d;border:1px solid #876132;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.total strong{font:600 22px Cinzel;color:#efd18a}.candidates{display:grid;gap:5px;margin-top:10px}.candidate{width:100%;text-align:left;background:#25140e}.note{color:#9f8767;font-size:13px;margin-top:10px}@media(max-width:850px){.controls{grid-template-columns:1fr 1fr}.controls label:first-child{grid-column:1/-1}.controls button{grid-column:1/-1}.card{grid-template-columns:58px 1fr 1fr}.card img{width:54px;height:54px}.name{grid-column:2/-1}.metric{padding-top:5px;border-top:1px solid #76572d55}}@media(max-width:480px){.wrap{width:min(100% - 14px,1100px);padding-top:10px}.controls{grid-template-columns:1fr}.controls label,.controls label:first-child,.controls button{grid-column:auto}.card{grid-template-columns:48px 1fr}.card img{width:46px;height:46px}.name{grid-column:2}.metric{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><header class="top"><div><small>MERCHANT EMPIRE · EUROPE</small><h1>Mercato</h1></div><a href="/MerchantEmpire/">← Sala del Tesoro</a></header><section class="panel"><div class="controls"><label>Oggetto italiano o Item ID<input id="query" value="set cacciatore t4" placeholder="es. Pelle media, T4_HIDE"></label><label>Città<select id="city"><option selected>Martlock</option><option>Bridgewatch</option><option>Fort Sterling</option><option>Lymhurst</option><option>Thetford</option><option>Caerleon</option><option>Brecilien</option></select></label><label>Qualità<select id="quality"><option value="1" selected>Normale</option><option value="2">Buona</option><option value="3">Eccezionale</option><option value="4">Eccellente</option><option value="5">Capolavoro</option></select></label><label>Quantità<input id="qty" type="number" min="1" value="1"></label><button id="go">Cerca mercato</button></div><div class="preset"><button data-set="hunter">Set Cacciatore T4</button><button data-id="T4_HIDE" data-name="Pelle media T4">Pelle media T4</button></div><div id="status" class="status">Pronto. Server: Europe · città predefinita: Martlock.</div><div id="candidates" class="candidates"></div></section><section id="results" class="results"></section><div id="total" class="total" hidden></div><p class="note">Fonte prezzi: Albion Online Data Project, server Europe. I dati dipendono dagli ordini caricati dai giocatori: controlla sempre la freschezza indicata.</p></main><script>const API='https://europe.albion-online-data.com/api/v2/stats';const META='https://raw.githubusercontent.com/ao-data/ao-bin-dumps/master/formatted/items.json';const HUNTER=[{id:'T4_HEAD_LEATHER_SET2',name:'Copricapo del Cacciatore T4'},{id:'T4_ARMOR_LEATHER_SET2',name:'Giacca del Cacciatore T4'},{id:'T4_SHOES_LEATHER_SET2',name:'Scarpe del Cacciatore T4'}];const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('it-IT').format(n||0);let meta=null;function freshness(d){if(!d)return'Nessun dato';const h=(Date.now()-new Date(d).getTime())/36e5;if(!Number.isFinite(h))return'Data sconosciuta';return h<=1?'Fresco':h<=24?'Recente':h<=72?'Datato':'Molto datato'}function icon(id,q){return'https://render.albiononline.com/v1/item/'+encodeURIComponent(id)+'.png?quality='+q+'&size=128'}async function prices(items){const city=$('city').value,q=$('quality').value,qty=Math.max(1,Number($('qty').value)||1);$('status').textContent='Caricamento prezzi Europe · '+city+'…';$('candidates').innerHTML='';const ids=items.map(x=>x.id).join(',');try{const [p,h]=await Promise.all([fetch(API+'/prices/'+ids+'.json?locations='+encodeURIComponent(city)+'&qualities='+q,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Prezzi HTTP '+r.status);return r.json()}),fetch(API+'/history/'+ids+'.json?locations='+encodeURIComponent(city)+'&qualities='+q+'&time-scale=24',{cache:'no-store'}).then(r=>r.ok?r.json():[])]);let sellTotal=0,buyTotal=0,avgTotal=0,avgCount=0;const html=items.map(it=>{const row=p.find(x=>x.item_id===it.id&&String(x.quality)===String(q))||{};const series=h.find(x=>x.item_id===it.id&&String(x.quality)===String(q));let units=0,val=0;(series?.data||[]).forEach(x=>{const c=Number(x.item_count)||0,a=Number(x.avg_price)||0;units+=c;val+=c*a});const avg=units?Math.round(val/units):0,sell=Number(row.sell_price_min)||0,buy=Number(row.buy_price_max)||0;sellTotal+=sell*qty;buyTotal+=buy*qty;if(avg){avgTotal+=avg*qty;avgCount++}return'<article class="card"><img src="'+icon(it.id,q)+'" alt=""><div class="name"><b>'+it.name+'</b><small>'+it.id+'</small><div class="fresh">'+freshness(row.sell_price_min_date||row.buy_price_max_date)+'</div></div><div class="metric"><small>Mercato stimato</small><strong>'+(avg?fmt(avg)+' Silver':'—')+'</strong></div><div class="metric"><small>In vendita ora</small><strong>'+(sell?fmt(sell)+' Silver':'—')+'</strong></div><div class="metric"><small>Buy order</small><strong>'+(buy?fmt(buy)+' Silver':'—')+'</strong></div><div class="metric"><small>Totale × '+qty+'</small><strong>'+(sell?fmt(sell*qty)+' Silver':'—')+'</strong></div></article>'}).join('');$('results').innerHTML=html;$('total').hidden=false;$('total').innerHTML='<span>Valore set/lotto in vendita ora<br><strong>'+(sellTotal?fmt(sellTotal)+' Silver':'—')+'</strong></span><span>Vendita immediata<br><strong>'+(buyTotal?fmt(buyTotal)+' Silver':'—')+'</strong></span><span>Stima storica<br><strong>'+(avgCount?fmt(avgTotal)+' Silver':'—')+'</strong></span>';$('status').textContent='Dati caricati · Europe · '+city+'.'}catch(e){$('status').textContent='Errore nel recupero AODP: '+e.message;$('results').innerHTML='';$('total').hidden=true}}async function lookup(){const q=$('query').value.trim();if(!q)return;if(/set.*cacciatore|cacciatore.*t4/i.test(q)){prices(HUNTER);return}if(/^T\d_/i.test(q)){prices([{id:q.toUpperCase(),name:q.toUpperCase()}]);return}$('status').textContent='Cerco il nome italiano nel registro Albion…';try{if(!meta){const r=await fetch(META,{cache:'force-cache'});if(!r.ok)throw Error('registro '+r.status);meta=await r.json()}const s=q.toLocaleLowerCase('it');const found=meta.filter(x=>{const it=x.LocalizedNames?.['IT-IT']||'',en=x.LocalizedNames?.['EN-US']||'';return it.toLocaleLowerCase('it').includes(s)||en.toLowerCase().includes(s)}).slice(0,8);if(!found.length){$('status').textContent='Nessun Item ID trovato per “'+q+'”.';return}if(found.length===1){const x=found[0];prices([{id:x.UniqueName,name:x.LocalizedNames?.['IT-IT']||x.LocalizedNames?.['EN-US']||x.UniqueName}]);return}$('status').textContent='Più corrispondenze: scegli quella corretta.';$('candidates').innerHTML=found.map((x,i)=>'<button class="candidate" data-i="'+i+'">'+(x.LocalizedNames?.['IT-IT']||x.LocalizedNames?.['EN-US']||x.UniqueName)+' · '+x.UniqueName+'</button>').join('');[...$('candidates').querySelectorAll('button')].forEach(b=>b.addEventListener('click',()=>{const x=found[Number(b.dataset.i)];prices([{id:x.UniqueName,name:x.LocalizedNames?.['IT-IT']||x.LocalizedNames?.['EN-US']||x.UniqueName}])}))}catch(e){$('status').textContent='Errore registro Albion: '+e.message}}$('go').addEventListener('click',lookup);$('query').addEventListener('keydown',e=>{if(e.key==='Enter')lookup()});document.querySelector('[data-set="hunter"]').addEventListener('click',()=>{$('query').value='set cacciatore t4';prices(HUNTER)});document.querySelector('[data-id]').addEventListener('click',e=>{$('query').value=e.currentTarget.dataset.name;prices([{id:e.currentTarget.dataset.id,name:e.currentTarget.dataset.name}])});</script></body></html>
